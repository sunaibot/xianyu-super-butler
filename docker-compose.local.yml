services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile-cn
    image: xianyu-auto-reply:latest
    container_name: xianyu-auto-reply
    restart: unless-stopped
    user: "0:0"
    ports:
      - "18080:8080"
    volumes:
      - ./local_data/data:/app/data:rw
      - ./local_data/logs:/app/logs:rw
      - ./global_config.yml:/app/global_config.yml:ro
      - ./local_data/backups:/app/backups:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Shanghai
      - DB_PATH=/app/data/xianyu_data.db
      - LOG_LEVEL=INFO
      - DEBUG=false
      - RELOAD=false
      - SQL_LOG_ENABLED=true
      - SQL_LOG_LEVEL=INFO
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET_KEY=default-secret-key
      - SESSION_TIMEOUT=3600
      - MULTIUSER_ENABLED=true
      - USER_REGISTRATION_ENABLED=true
      - EMAIL_VERIFICATION_ENABLED=true
      - CAPTCHA_ENABLED=true
      - TOKEN_EXPIRE_TIME=86400
      - AUTO_REPLY_ENABLED=true
      - AUTO_DELIVERY_ENABLED=true
      - AUTO_DELIVERY_TIMEOUT=30
      - API_CARD_TIMEOUT=10
      - BATCH_DATA_LOCK_TIMEOUT=5
      - AI_REPLY_ENABLED=false
      - DEFAULT_AI_MODEL=qwen-plus
      - DEFAULT_AI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - AI_REQUEST_TIMEOUT=30
      - AI_MAX_TOKENS=100
      - WEBSOCKET_URL=wss://wss-goofish.dingtalk.com/
      - HEARTBEAT_INTERVAL=15
      - HEARTBEAT_TIMEOUT=5
      - TOKEN_REFRESH_INTERVAL=3600
      - TOKEN_RETRY_INTERVAL=300
      - MESSAGE_EXPIRE_TIME=300000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

networks:
  xianyu-network:
    driver: bridge
