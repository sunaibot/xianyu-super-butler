services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-auto-reply:latest
    container_name: xianyu-auto-reply
    restart: unless-stopped
    # 容器以 root 启动（entrypoint 用 gosu 降权到 appuser 运行应用，最小权限）
    ports:
      - "18080:8080"
    volumes:
      - /vol1/1000/docker/xianyu/data:/app/data:rw
      - /vol1/1000/docker/xianyu/logs:/app/logs:rw
      - /vol1/1000/docker/xianyu/backups:/app/backups:rw
      - /vol1/1000/docker/xianyu/global_config.yml:/app/global_config.yml:ro
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?必须在 .env 中设置强密码}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DB_PATH=/app/data/xianyu_data.db
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SQL_LOG_ENABLED=${SQL_LOG_ENABLED:-false}
      - SQL_LOG_LEVEL=${SQL_LOG_LEVEL:-INFO}
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: xianyu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /vol1/1000/docker/xianyu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /vol1/1000/docker/xianyu/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - xianyu-app
    networks:
      - xianyu-network
    profiles:
      - with-nginx

networks:
  xianyu-network:
    driver: bridge
