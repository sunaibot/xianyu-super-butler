services:
  xianyu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-auto-reply:latest
    container_name: xianyu-auto-reply
    restart: unless-stopped
    # 容器以 root 启动（entrypoint 用 gosu 降权到 appuser 运行应用，最小权限）
    ports:
      - "${WEB_PORT:-18080}:8080"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./backups:/app/backups:rw
      - ./global_config.yml:/app/global_config.yml:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # ===== 安全配置（必须修改）=====
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?必须在 .env 中设置强密码}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      # ===== 数据库 =====
      - DB_PATH=${DB_PATH:-/app/data/xianyu_data.db}
      # ===== 运行模式（仅传递代码实际读取的变量；功能开关/AI 配置请改 global_config.yml）=====
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SQL_LOG_ENABLED=${SQL_LOG_ENABLED:-false}
      - SQL_LOG_LEVEL=${SQL_LOG_LEVEL:-INFO}
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2048}M
          cpus: '${CPU_LIMIT:-2.0}'
        reservations:
          memory: ${MEMORY_RESERVATION:-512}M
          cpus: '${CPU_RESERVATION:-0.5}'

networks:
  xianyu-network:
    driver: bridge
